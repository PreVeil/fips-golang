name: CI
on:
  push:
    branches:
      - master
  pull_request:

jobs:
  test:
    name: Unit tester
    env:
      FIPS_DIR: fips-temp
      FIPS_GOLANG_REPO: fips-golang-repo
      # fips-crypto build to download from S3.
      FIPS_COMMIT_ID: 1eb389c924a47e8ecf832cbd247df6e1c9ea4849

    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:

    - name: Set up Go 1.19
      uses: actions/setup-go@v2
      with:
        go-version: 1.19
      id: go

    - name: Check out code into the Go module directory
      uses: actions/checkout@v5
      with:
        path: ${{ env.FIPS_GOLANG_REPO }}

    - name: Download fips libraries
      run: |
        case "$RUNNER_OS" in
          macOS) FIPS_S3_BIN=osx; FIPS_ARCHIVE=fips-crypto.tar.gz ;;
          Linux) FIPS_S3_BIN=linux_x64; FIPS_ARCHIVE=fips-crypto.tar.gz ;;
          Windows) FIPS_S3_BIN=win_64; FIPS_ARCHIVE=fips-crypto.zip ;;
        esac
        echo "fips-commit-id:" $FIPS_COMMIT_ID
        rm -rf $FIPS_DIR && mkdir -p $FIPS_DIR/fips-crypto
        aws s3 cp --no-sign-request s3://pv-bin-storage/ci/fipscrypto_build_$FIPS_S3_BIN/$FIPS_COMMIT_ID/$FIPS_ARCHIVE $FIPS_DIR/$FIPS_ARCHIVE
        if [ "$FIPS_ARCHIVE" = fips-crypto.zip ]; then
          (cd $FIPS_DIR && unzip -o -j $FIPS_ARCHIVE)
        else
          tar -xzf $FIPS_DIR/$FIPS_ARCHIVE -C $FIPS_DIR --strip-components=1
        fi
        cp $FIPS_DIR/fips-crypto.h $FIPS_DIR/fips-crypto/
        rm -f $FIPS_DIR/$FIPS_ARCHIVE
        FIPS_PATH=$(cd $FIPS_DIR && pwd)
        if [ "$RUNNER_OS" = Windows ]; then FIPS_PATH=$(cygpath -w "$FIPS_PATH"); fi
        echo "FIPS_CRYPTO_CONFIG_DIR=$FIPS_PATH" >> $GITHUB_ENV
        echo "FIPS_CRYPTO_PROVIDER_DIR=$FIPS_PATH" >> $GITHUB_ENV
        echo "$FIPS_PATH" >> $GITHUB_PATH
      shell: bash
      working-directory: ./${{ env.FIPS_GOLANG_REPO }}

    - name: Set up fips-crypto
      if: matrix.os == 'ubuntu-latest'
      run: sudo cp -P $FIPS_DIR/libfips-crypto.so* /usr/lib
      working-directory: ./${{ env.FIPS_GOLANG_REPO }}

    - name: Run unit tests
      run: FIPSDIR=$(pwd)/$FIPS_DIR make test
      shell: bash
      working-directory: ./${{ env.FIPS_GOLANG_REPO }}

    - name: Run code vetting
      run: FIPSDIR=$(pwd)/$FIPS_DIR make vet
      shell: bash
      working-directory: ./${{ env.FIPS_GOLANG_REPO }}
